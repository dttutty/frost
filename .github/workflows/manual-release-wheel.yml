name: release-wheel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that should receive the built wheel
        required: true
        type: string
      create_release_if_missing:
        description: Create the GitHub Release automatically if it does not exist
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-upload-wheel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ninja

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify release exists or create it
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Using existing release: $tag"
            exit 0
          fi

          if [[ "${{ github.event.inputs.create_release_if_missing }}" != "true" ]]; then
            echo "Release $tag does not exist and auto-creation is disabled."
            exit 1
          fi

          gh release create "$tag" \
            --title "$tag" \
            --notes "Automated wheel build uploaded by the release-wheel workflow."

      - name: Upload wheel and sdist to GitHub Release
        run: gh release upload "${{ github.event.inputs.tag }}" dist/* --clobber
