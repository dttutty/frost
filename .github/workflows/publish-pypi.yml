name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Verified GitHub Release tag, e.g. v0.3.1'
        required: true
        type: string
      dry_run:
        description: 'Validate artifacts without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          release_commit=$(git rev-parse --verify "${RELEASE_TAG}^{commit}")
          uv run --no-project --python 3.12 python .github/scripts/verify_pypi_release.py \
            --source release-assets --output dist --tag "$RELEASE_TAG" --commit "$release_commit"
          uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/frost-gnn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
