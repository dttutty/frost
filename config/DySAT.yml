sampling:
  - layer: 2
    neighbor: 
      - 10
      - 10
    strategy: 'uniform'
    prop_time: True
    history: 3
    duration: 10000
    num_thread: 32
gnn:
  - arch: 'attn'
    layer: 2
    att_h: 2
    d_time: 0
    d_hid: 100
    combine: 'rnn'
train:
  - epoch: 50
    batch_size: 600
    lr: 0.0001
    dropout: 0.1
    att_dropout: 0.1
    all_on_gpu: False
