gnn:
  - arch: 'attn'
    neighbor: 
      - 10
      - 10
    sampling_strategy: 'uniform'
    prop_time: False
    snapshot:
      - history: 1
        duration: 0
    att_h: 2
    d_time: 100
    d_hid: 100
train:
  - epoch: 100
    batch_size: 600
    lr: 0.0001
    dropout: 0.1
    att_dropout: 0.1
    all_on_gpu: False
