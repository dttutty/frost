sampling:
  - layer: 1
    neighbor: 
      - 100
    strategy: 'recent'
    prop_time: False
    history: 1
    duration: 0
    num_thread: 32
memory: 
  - d_time: 100
    deliver_to: 'self'
    mail_combine: 'last'
    memory_update: 'gru'
    boxsize: 1
    combine_node_feature: True
    d_hid: 100
gnn:
  - arch: 'attn'
    layer: 1
    att_h: 2
    d_time: 100
    d_hid: 100
train:
  - epoch: 100
    batch_size: 600
    # reorder: 16
    lr: 0.0001
    dropout: 0.2
    att_dropout: 0.2
    all_on_gpu: False
