sampling:
  - layer: 1
    neighbor: 
      - 10
    strategy: 'recent'
    prop_time: False
    history: 1
    duration: 0
    num_thread: 64
    neg_samples: 1
    sample_neighbors_for_neg_root_nodes : False
memory: 
  - d_time: 100
    deliver_to: 'neighbors'
    mail_combine: 'last'
    cell: 'transformer'
    att_h: 2
    boxsize: 10
    combine_node_feature: False
    d_mem: 100
gnn:
  - arch: 'identity'
train:
  - epoch: 50
    batch_size: 4000 # local batch_size
    lr: 0.0001
    dropout: 0.1
    reorder: 8
    model: "APAN"