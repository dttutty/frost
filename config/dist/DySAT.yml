sampling:
  - layer: 2
    neighbor: 
      - 25
      - 25
    strategy: 'uniform'
    prop_time: True
    history: 3
    duration: 10000
    num_thread: 64
gnn:
  - arch: 'attn'
    layer: 2
    att_h: 2
    d_time: 0
    d_out: 100
    combine: 'rnn'
train:
  - epoch: 3
    batch_size: 4000 # local batch_size
    lr: 0.0001
    dropout: 0.1
    model: "DySAT"