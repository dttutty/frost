sampling:
  - layer: 2
    neighbor: 
      - 10
      - 10
    strategy: 'uniform'
    prop_time: True
    history: 3
    duration: 25
    num_thread: 64
memory: 
  - d_hid: 0
gnn:
  - arch: 'attn'
    layer: 2
    att_h: 2
    d_time: 0
    d_hid: 100
    combine: 'rnn'
train:
  - epoch: 10
    batch_size: 4000 # local batch_size
    lr: 0.0001
    dropout: 0.1
    att_dropout: 0.1