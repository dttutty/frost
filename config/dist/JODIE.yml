sampling:
  - is_sample_support_node: False
    history: 1
    neg_samples: 1
memory: 
  - d_time: 100
    deliver_to: 'self'
    mail_combine: 'last'
    cell: 'rnn'
    boxsize: 1
    combine_node_feature: True
    d_mem: 100
gnn:
  - arch: 'identity'
    time_transform: 'JODIE'
train:
  - epoch: 10
    batch_size: 4000 # local batch_size
    lr: 0.0001
    dropout: 0.1
    reorder: 8
    model: "JODIE"