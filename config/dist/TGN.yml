sampling:
  - layer: 1
    neighbor: 
      - 10
    strategy: 'recent'
    prop_time: False
    history: 1
    duration: 0
    num_thread: 64
memory: 
  - d_time: 100
    deliver_to: 'self'
    mail_combine: 'last'
    cell: 'gru'
    boxsize: 1
    combine_node_feature: True
    d_mem: 100
gnn:
  - arch: 'attn'
    layer: 1
    att_h: 2
    d_time: 100
    d_hid: 100
train:
  - epoch: 3
    batch_size: 4000 # local batch_size
    lr: 0.0001
    dropout: 0.2
    reorder: 8
    model: "TGN"
