defaults:
  - optional access_analyzer: null
  - encoder: tgn
  - loss_fn: bce  # no need to change mostly
  - mem_updater: null
  - neg_sampler: precomputed # precomputed | rnd_then_rnd | rnd_then_hist | rnd_then_ind
  - ngh_sampler: recent
  - precision: base # no need to change mostly
  - predictor: link # don't change this, current version only support link prediction
  - _self_

epoch: 100
macro_batch_size: 4000 # total batch size across all GPUs
patience: 100
dropout: 0.2
seed: 42
d_time: 128
dataset: "LASTFM"
optimizer: "adam"
lr: 0.0001
n_neg: 1
ring_buf_size: 64
if_carry_over_route: false
ignore_nfeat_on_disk: false
ignore_efeat_on_disk: false
no_memory_queue_size: 4
compile: false
tf32: false
amp: false
tqdm: true
stable_mode: false
reset_eval_neg_sampler_each_epoch: false
share_neg_sampler_across_splits: false
normalize_event_time: false
persist_all_updates_to_cpu: false
dynamic_state_ablation: baseline
