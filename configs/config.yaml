defaults:
  - optional access_analyzer: null
  - encoder: tgn
  - loss_fn: bce  # no need to change mostly
  - mem_updater: null
  - neg_sampler: base # don't change this unless you implement a new neg_sampler
  - precision: base # no need to change mostly
  - predictor: link # don't change this, current version only support link prediction
  - _self_

epoch: 100
batch_size: 4000 # local batch_size
patience: 100
dropout: 0.2
seed: 42
d_time: 128
dataset: "LASTFM"
optimizer: "adam"
lr: 0.0001
n_neg: 1
ring_buf_size: 32
handle_stale: false
compile: false
tf32: false
tqdm: true
