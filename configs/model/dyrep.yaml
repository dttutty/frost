_target_: frost.models.recipes.DyRepRecipe
embedding_dim: 128
neighborhood:
  fanout: [10]
encoder:
  _target_: frost.models.encoder.dyrep.DyRep
  ndim: ${ndim}
  edim: ${edim}
  d_mem: ${model.embedding_dim}
  d_out: ${model.embedding_dim}
  d_time: ${d_time}
  heads: 2
  dropout: ${dropout}
  use_structural_attention: true
state:
  boxsize: 1
  mail_combine: last
  updater:
    _target_: frost.models.mem_updater.MemoryUpdater
    d_time: ${d_time}
    cell: gru
    d_mem: ${model.embedding_dim}
head:
  _target_: frost.models.header.LinkPredictor
  d_in: ${model.embedding_dim}
  n_neg: ${n_neg}
