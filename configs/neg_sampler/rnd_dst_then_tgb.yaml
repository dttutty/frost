# Official TGB protocol: one random training destination; evaluation layout
# inferred from dataset: Wiki=999 (masked), Review=100, Coin/Comment/Flight=20.
seed: ${seed}
train:
  _target_: frost.neg_sampler.RandomNegLinkSampler
  n_neg: 1
  candidate_mode: dst_partition
eval:
  _target_: frost.neg_sampler.TGBEvalNegSampler
  n_neg: auto
  allow_variable_width: auto
