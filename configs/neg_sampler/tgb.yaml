# TGB uses one random destination per training edge and a fixed official
# candidate set per validation/test query. Override eval.n_neg per dataset:
#   tgbl-review: 100
#   tgbl-coin, tgbl-comment, tgbl-flight: 20
# Official tgbl-wiki candidate sets are variable-width and are intentionally
# rejected by the current fixed-width runtime.
seed: ${seed}
train:
  _target_: frost.neg_sampler.RandomNegLinkSampler
  n_neg: 1
  candidate_mode: dst_partition
eval:
  _target_: frost.neg_sampler.TGBEvalNegSampler
  n_neg: 20
