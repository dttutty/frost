[build-system]
# Use scikit-build-core to handle C++ builds and Python packaging end to end.
requires = ["scikit-build-core>=0.10", "nanobind>=2.12.0"]
build-backend = "scikit_build_core.build"

[project]
name = "frost-gnn"  # pip accepts frost_gnn and frost-gnn.
version = "0.3.1"
description = "Multi-GPU Temporal(Dynamic) GNN framework for recommendation systems and self-supervised embedding learning."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    # Core ML
    "torch==2.9.0",
    "torchmetrics>=1.0.0",
    # Config
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # Data
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.0", # TPNet classic AP/AUC evaluation
    "zstandard>=0.25.0",
    # Utilities
    "python-dotenv>=1.0",
    "tqdm>=4.60",
    "PyYAML>=6.0",
]

[project.urls]
Paper = "https://doi.org/10.1145/3856345"
Datasets = "https://huggingface.co/datasets/dttutty/frost_dataset"

[project.scripts]
frost = "frost.predict.cli:main"
frost-data = "frost.data.cli:main"
frost-run = "frost.cli:main"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-PyYAML",
    "nanobind>=2.12.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
extend-exclude = ["third_party"]

[tool.ruff.lint]
exclude = ["third_party"]

[tool.ruff.format]
exclude = ["third_party"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

[tool.scikit-build]
cmake.build-type = "RelWithDebInfo"
# Important: tell scikit-build to package the Python namespace under src into the wheel.
wheel.packages = ["src/frost"]
sdist.include = ["CMakeLists.txt", "configs/**"]
sdist.exclude = ["artifacts/**", "benchmarks/**", "docs/artifact_organization.md", "docs/camera_ready_sources.md", "third_party/**"]
