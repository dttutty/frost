[build-system]
# 使用 scikit-build-core 统一接管 C++ 编译和 Python 打包
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "frost"  # 统一对外的包名
version = "0.1.0"
description = "A high-performance distributed GNN training framework with sequence-based samplers."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # Core ML
    "torch>=2.5.0",
    "torchmetrics>=1.0.0",
    # Config
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # Data
    "numpy>=2.0",
    "pandas>=2.0",
    # Utilities
    "tqdm>=4.60",
    "PyYAML>=6.0",
    # C++ extension runtime (Intel TBB, linked by seq_sampler)
    "tbb",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]

test = ["pytest", "pytest-cov"]
dev = [
    "pytest",
    "ruff",
]

[tool.scikit-build]
cmake.build-type = "RelWithDebInfo"
# 关键：告诉 scikit-build 去 src 目录下把这两个独立的 Python 命名空间都打包进 wheel 中
wheel.packages = ["src/frost"]