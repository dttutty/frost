[build-system]
# Use scikit-build-core to handle C++ builds and Python packaging end to end.
requires = ["scikit-build-core>=0.10", "nanobind>=2.12.0"]
build-backend = "scikit_build_core.build"

[project]
name = "frost"  # Public package name.
version = "0.1.0"
description = "A high-performance distributed GNN training framework with sequence-based samplers."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # Core ML
    "torch==2.9.0",
    "torchmetrics>=1.0.0",
    # Config
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # Data
    "numpy>=2.0",
    "pandas>=2.0",
    "zstandard>=0.25.0",
    # Utilities
    "python-dotenv>=1.0",
    "tqdm>=4.60",
    "PyYAML>=6.0",
    "scikit-learn>=1.0",
    "matplotlib",
]

[project.scripts]
frost-data = "frost.data.cli:main"
frost-train = "frost_bench.cli.train:main"
frost-suite = "frost_bench.cli.suite:main"
frost-sweep = "frost_bench.cli.sweep:main"
frost-compare-pipetgl = "frost_bench.cli.compare_pipetgl:main"
frost-compare-tgl-mrr = "frost_bench.cli.compare_tgl_mrr:main"
frost-official-tgb-tgn = "frost_bench.cli.official_tgb_tgn:main"
frost-tgb-tgn-queue = "frost_bench.cli.tgb_tgn_queue:main"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-PyYAML",
    "nanobind>=2.12.0",
]
tgb = [
    "clint>=0.5.1",
    "numba>=0.61.0",
    "torch-geometric>=2.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
extend-exclude = ["third_party", "third_party_papers"]

[tool.ruff.lint]
exclude = ["third_party", "third_party_papers"]

[tool.ruff.format]
exclude = ["third_party", "third_party_papers"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

[tool.scikit-build]
cmake.build-type = "RelWithDebInfo"
# Important: tell scikit-build to package the Python namespace under src into the wheel.
wheel.packages = ["src/frost", "src/frost_bench"]
