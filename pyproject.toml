[build-system]
# 使用 scikit-build-core 统一接管 C++ 编译和 Python 打包
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "frost"  # 统一对外的包名
version = "0.1.0"
description = "A high-performance distributed GNN training framework with sequence-based samplers."
requires-python = ">=3.10"
license = {text = "MIT"}
# 合并两者的依赖
dependencies = [
    "torch>=2.0.0",
    "hydra-core>=1.3.2",
    "omegaconf",
    "numpy",
    "pandas",
    "tbb"
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.scikit-build]
cmake.build-type = "RelWithDebInfo"
# 关键：告诉 scikit-build 去 src 目录下把这两个独立的 Python 命名空间都打包进 wheel 中
wheel.packages = ["src/frost"]