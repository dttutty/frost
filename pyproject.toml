[build-system]
# 使用 scikit-build-core 统一接管 C++ 编译和 Python 打包
requires = ["scikit-build-core>=0.10", "nanobind>=2.12.0"]
build-backend = "scikit_build_core.build"

[project]
name = "frost"  # 统一对外的包名
version = "0.1.0"
description = "A high-performance distributed GNN training framework with sequence-based samplers."
readme = "readme.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # Core ML
    "torch==2.5.1",
    "torchmetrics>=1.0.0",
    # Config
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # Data
    "numpy>=2.0",
    "pandas>=2.0",
    # Utilities
    "tqdm>=4.60",
    "PyYAML>=6.0",
    "scikit-learn>=1.0",
]

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-PyYAML",
    "nanobind>=2.12.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

[tool.scikit-build]
cmake.build-type = "RelWithDebInfo"
# 关键：告诉 scikit-build 去 src 目录下把这两个独立的 Python 命名空间都打包进 wheel 中
wheel.packages = ["src/frost"]
